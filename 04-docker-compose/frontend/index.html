<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 20px; }
    #status { margin-bottom: 16px; padding: 8px; border-radius: 4px; font-size: 14px; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; }
    li { padding: 10px; border-bottom: 1px solid #eee; }
    .time { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Todo App</h1>
  <div id="status">Checking connection...</div>

  <form id="form">
    <input id="task" type="text" placeholder="Add a new todo..." required />
    <button type="submit">Add</button>
  </form>

  <ul id="todos"></ul>

  <script>
    const API = "http://localhost:3001/api";

    async function checkHealth() {
      const el = document.getElementById("status");
      try {
        const res = await fetch(`${API}/health`);
        const data = await res.json();
        el.textContent = `Backend: ${data.status} | DB: ${data.db}`;
        el.className = "ok";
      } catch (err) {
        el.textContent = `Cannot reach backend: ${err.message}`;
        el.className = "err";
      }
    }

    async function loadTodos() {
      const res = await fetch(`${API}/todos`);
      const todos = await res.json();
      const ul = document.getElementById("todos");
      ul.innerHTML = todos.map(t =>
        `<li>${t.task} <span class="time">${new Date(t.created_at).toLocaleString()}</span></li>`
      ).join("");
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("task");
      await fetch(`${API}/todos`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task: input.value }),
      });
      input.value = "";
      loadTodos();
    });

    checkHealth();
    loadTodos();
  </script>
</body>
</html>
