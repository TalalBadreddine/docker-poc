<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Basics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #ededed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #888;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    .info {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 1.5rem 2rem;
      text-align: left;
      display: inline-block;
    }
    .info div {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .label { color: #0af; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello Docker!</h1>
    <p>This page is served from inside a Docker container tag:1.2</p>
    <div class="info">
      <div><span class="label">Image:</span> nginx:alpine</div>
      <div><span class="label">What:</span> A static HTML file copied into the container</div>
      <div><span class="label">Port:</span> 80 (container)</div>
    </div>
  </div>
</body>
</html>
